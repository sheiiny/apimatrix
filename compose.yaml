name: toolcabinet

services:
  api:
    image: toolcabinetapi:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "127.0.0.1:${TOOLCABINET_PORT:-5080}:8080"
    restart: unless-stopped
